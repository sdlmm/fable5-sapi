<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食どくクエスト 〜食と毒のだいぼうけん〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3b33;          /* 輪郭・文字のこげ茶 */
  --paper:#fff8e4;        /* クリーム色の紙 */
  --panel:#ffffff;
  --red:#ff6b4a;          /* 主人公・ダメージ */
  --red-deep:#e84e2c;
  --green:#4cb86d;        /* せいかい */
  --green-deep:#33995a;
  --blue:#4a93d9;
  --blue-deep:#2f74b8;
  --purple:#8e6bc8;       /* 毒のむらさき */
  --yellow:#ffd34d;
  --orange:#ff9f3c;
  --pink:#ff9fb0;
  --shadow:0 6px 0 rgba(74,59,51,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;
  font-weight:700;color:var(--ink);
  background:
    radial-gradient(rgba(255,211,77,.35) 12%, transparent 13%) 0 0/34px 34px,
    radial-gradient(rgba(255,159,60,.18) 12%, transparent 13%) 17px 17px/34px 34px,
    var(--paper);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100%;
}
#app{width:100%;max-width:760px;padding:14px 12px 40px}
ruby rt{font-size:.5em;font-weight:700;color:var(--ink)}

/* ===== 共通パネル(テキスト教材の枠ふう) ===== */
.panel{
  background:var(--panel);
  border:4px solid var(--ink);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:18px;
  position:relative;
}
.btn{
  font-family:inherit;font-weight:800;color:#fff;
  background:var(--red);
  border:4px solid var(--ink);
  border-radius:999px;
  padding:12px 30px;font-size:20px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--ink);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:var(--blue)}
.btn.green{background:var(--green)}

/* ===== タイトル画面 ===== */
.title-screen{text-align:center;padding-top:10px}
.title-ribbon{
  display:inline-block;background:var(--yellow);
  border:4px solid var(--ink);border-radius:999px;
  padding:6px 22px;font-size:15px;letter-spacing:.12em;
  box-shadow:var(--shadow);margin-bottom:10px;
}
.game-title{
  font-family:"Mochiy Pop One",sans-serif;
  font-size:clamp(34px,8vw,56px);
  line-height:1.2;color:var(--red-deep);
  text-shadow:
    3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,
    0 7px 0 rgba(74,59,51,.22);
  margin:4px 0 0;
}
.game-sub{
  font-family:"Mochiy Pop One",sans-serif;
  font-size:clamp(15px,3.4vw,21px);color:var(--ink);
  margin:6px 0 10px;
}
.title-art{margin:6px auto;max-width:430px}
.title-art svg{width:100%;height:auto;display:block}
.title-msg{font-size:15px;line-height:1.9;margin:8px auto 16px;max-width:480px}

/* ===== バトル画面 ===== */
.hud{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px;flex-wrap:wrap;
}
.chapter-tag{
  background:var(--purple);color:#fff;
  border:3px solid var(--ink);border-radius:999px;
  padding:5px 16px;font-size:14px;box-shadow:0 4px 0 rgba(74,59,51,.2);
}
.q-count{
  background:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:5px 16px;font-size:14px;box-shadow:0 4px 0 rgba(74,59,51,.2);
}
.stage{
  border:4px solid var(--ink);border-radius:22px;
  background:linear-gradient(#bfe6ff 0 62%, #b6e2a0 62% 100%);
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  height:300px;
}
.stage .cloud{position:absolute;opacity:.9}
.enemy-zone{position:absolute;right:6%;bottom:24%;width:42%;max-width:230px}
.enemy-zone svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(74,59,51,.18))}
.hero-zone{position:absolute;left:5%;bottom:7%;width:30%;max-width:160px}
.hero-zone svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(74,59,51,.18))}
.enemy-name{
  position:absolute;right:5%;top:6%;
  background:#fff;border:3px solid var(--ink);border-radius:14px;
  padding:5px 14px;font-size:15px;box-shadow:0 4px 0 rgba(74,59,51,.2);
}
.enemy-name small{display:block;font-size:11px;color:var(--purple)}
.hp-box{
  position:absolute;left:4%;top:6%;
  background:#fff;border:3px solid var(--ink);border-radius:14px;
  padding:7px 12px;width:46%;max-width:230px;
  box-shadow:0 4px 0 rgba(74,59,51,.2);
}
.hp-label{font-size:12px;display:flex;justify-content:space-between}
.hp-bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#f1e7d8;overflow:hidden;margin-top:3px}
.hp-fill{height:100%;background:linear-gradient(#7fe09b,#4cb86d);border-radius:999px;transition:width .5s}
.hp-fill.low{background:linear-gradient(#ffd34d,#ff9f3c)}
.hp-fill.danger{background:linear-gradient(#ff8f7a,#e84e2c)}

/* せりふ・問題 */
.speech{
  margin-top:12px;
  background:#fff;border:4px solid var(--ink);border-radius:18px;
  box-shadow:var(--shadow);padding:14px 16px;
}
.speech .q-badge{
  display:inline-block;background:var(--blue);color:#fff;
  border:3px solid var(--ink);border-radius:999px;
  padding:3px 14px;font-size:13px;margin-bottom:7px;
}
.q-text{font-size:clamp(16px,3.6vw,20px);line-height:1.7}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.choice{
  font-family:inherit;font-weight:700;font-size:clamp(15px,3.4vw,18px);
  text-align:left;color:var(--ink);
  background:#fff;border:3.5px solid var(--ink);border-radius:16px;
  padding:11px 14px 11px 12px;cursor:pointer;
  box-shadow:0 5px 0 rgba(74,59,51,.22);
  display:flex;align-items:center;gap:10px;
  transition:transform .08s, box-shadow .08s, background .15s;
  line-height:1.5;
}
.choice:hover{background:#fff3d6}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(74,59,51,.22)}
.choice .mark{
  flex:0 0 34px;height:34px;border-radius:50%;
  background:var(--yellow);border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:"Mochiy Pop One",sans-serif;font-size:16px;
}
.choice:disabled{opacity:.55;cursor:default}
.choice.picked-correct{background:#dcf5e4;border-color:var(--green-deep)}
.choice.picked-wrong{background:#ffe2da;border-color:var(--red-deep)}

/* 解説オーバーレイ */
.overlay{
  position:fixed;inset:0;background:rgba(74,59,51,.45);
  display:flex;justify-content:center;align-items:center;
  padding:16px;z-index:50;animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.result-card{
  width:100%;max-width:560px;background:#fff;
  border:5px solid var(--ink);border-radius:26px;
  box-shadow:0 10px 0 rgba(74,59,51,.3);
  padding:20px;text-align:center;
  animation:popUp .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popUp{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.result-stamp{
  font-family:"Mochiy Pop One",sans-serif;
  font-size:clamp(28px,6vw,40px);
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff;
}
.result-stamp.ok{color:var(--green-deep)}
.result-stamp.ng{color:var(--red-deep)}
.result-dmg{font-size:15px;color:var(--red-deep);margin-top:2px}
.kaisetsu{
  text-align:left;background:var(--paper);
  border:3px dashed var(--orange);border-radius:16px;
  padding:13px 15px;margin:12px 0;
  font-size:15px;line-height:1.9;font-weight:500;
}
.kaisetsu b{color:var(--red-deep)}
.kaisetsu .k-title{
  display:inline-block;background:var(--orange);color:#fff;
  border-radius:999px;padding:2px 14px;font-size:13px;font-weight:800;
  margin-bottom:6px;
}

/* 章とびら */
.chapter-screen{text-align:center;padding-top:24px}
.chapter-num{
  display:inline-block;background:var(--blue);color:#fff;
  border:4px solid var(--ink);border-radius:999px;
  padding:7px 26px;font-size:18px;box-shadow:var(--shadow);
  font-family:"Mochiy Pop One",sans-serif;
}
.chapter-title{
  font-family:"Mochiy Pop One",sans-serif;
  font-size:clamp(26px,6vw,40px);margin:14px 0 6px;
  text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff;
}
.chapter-art{max-width:300px;margin:10px auto}
.chapter-art svg{width:100%;height:auto}
.chapter-desc{font-size:15px;line-height:1.9;max-width:440px;margin:0 auto 18px}

/* エンディング・ゲームオーバー */
.end-screen{text-align:center;padding-top:18px}
.rank-card{
  display:inline-block;background:#fff;border:4px solid var(--ink);
  border-radius:20px;padding:14px 30px;box-shadow:var(--shadow);
  margin:12px 0;
}
.rank-card .rank-name{
  font-family:"Mochiy Pop One",sans-serif;
  font-size:clamp(24px,5.5vw,34px);color:var(--orange);
  text-shadow:2px 2px 0 #fff;
}
.stat-row{font-size:16px;margin-top:6px}

/* アニメーション */
.shake{animation:shake .5s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-12px) rotate(-3deg)}
  35%{transform:translateX(10px) rotate(2deg)}
  55%{transform:translateX(-8px)}
  75%{transform:translateX(6px)}
}
.flash-red{animation:flashRed .5s}
@keyframes flashRed{
  20%{background:rgba(232,78,44,.35)}
}
.enemy-hit{animation:enemyHit .7s forwards}
@keyframes enemyHit{
  0%{transform:none;opacity:1}
  20%{transform:translateX(14px) rotate(6deg)}
  100%{transform:translateY(30px) rotate(18deg);opacity:0}
}
.enemy-in{animation:enemyIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes enemyIn{from{transform:translateX(70px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.hero-bounce{animation:heroBounce 2.2s ease-in-out infinite}
@keyframes heroBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.enemy-float{animation:enemyFloat 2.6s ease-in-out infinite}
@keyframes enemyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.sound-btn{
  position:fixed;top:10px;right:10px;z-index:60;
  width:46px;height:46px;border-radius:50%;
  background:#fff;border:3px solid var(--ink);
  box-shadow:0 4px 0 rgba(74,59,51,.25);
  cursor:pointer;font-size:12px;font-weight:800;color:var(--ink);
  font-family:inherit;
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
@media (max-width:480px){
  .stage{height:250px}
  .panel{padding:14px}
}
</style>
</head>
<body>
<button class="sound-btn" id="soundBtn" aria-label="音のオン・オフ">音<br>ON</button>
<div id="app"></div>
<script>
/* =====================================================
   食どくクエスト 〜食と毒のだいぼうけん〜
   学習塾イベント「食と毒」用クイズRPG
===================================================== */
/* ---------- SVGイラスト集(教材マスコット風) ---------- */
const INK = "#4a3b33";
function svgWrap(vb, inner){
  return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg" role="img">'+inner+'</svg>';
}
/* 目・ほっぺなどの共通パーツ */
function eyes(x1,x2,y,r){
  r = r||7;
  return '<circle cx="'+x1+'" cy="'+y+'" r="'+r+'" fill="'+INK+'"/>'+
         '<circle cx="'+x2+'" cy="'+y+'" r="'+r+'" fill="'+INK+'"/>'+
         '<circle cx="'+(x1+2.5)+'" cy="'+(y-2.5)+'" r="'+(r*.32)+'" fill="#fff"/>'+
         '<circle cx="'+(x2+2.5)+'" cy="'+(y-2.5)+'" r="'+(r*.32)+'" fill="#fff"/>';
}
function angryEyes(x1,x2,y){
  return '<path d="M'+(x1-9)+' '+(y-9)+' L'+(x1+7)+' '+(y-3)+'" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>'+
         '<path d="M'+(x2+9)+' '+(y-9)+' L'+(x2-7)+' '+(y-3)+'" stroke="'+INK+'" stroke-width="4" stroke-linecap="round"/>'+
         '<circle cx="'+x1+'" cy="'+y+'" r="6.5" fill="'+INK+'"/>'+
         '<circle cx="'+x2+'" cy="'+y+'" r="6.5" fill="'+INK+'"/>'+
         '<circle cx="'+(x1+2)+'" cy="'+(y-2)+'" r="2" fill="#fff"/>'+
         '<circle cx="'+(x2+2)+'" cy="'+(y-2)+'" r="2" fill="#fff"/>';
}
function cheeks(x1,x2,y,c){
  c = c||"#ff9fb0";
  return '<ellipse cx="'+x1+'" cy="'+y+'" rx="9" ry="5.5" fill="'+c+'" opacity=".75"/>'+
         '<ellipse cx="'+x2+'" cy="'+y+'" rx="9" ry="5.5" fill="'+c+'" opacity=".75"/>';
}

/* ---- 主人公(フォークの剣となべブタの盾を持つ子) ---- */
const ART_HERO = svgWrap("0 0 200 220",
  /* 盾(なべブタ) */
  '<circle cx="38" cy="140" r="30" fill="#9fb6c9" stroke="'+INK+'" stroke-width="5"/>'+
  '<circle cx="38" cy="140" r="18" fill="#c5d6e4" stroke="'+INK+'" stroke-width="4"/>'+
  '<circle cx="38" cy="140" r="6" fill="'+INK+'"/>'+
  /* フォークの剣 */
  '<rect x="156" y="68" width="9" height="76" rx="4" fill="#f3c14b" stroke="'+INK+'" stroke-width="4"/>'+
  '<path d="M147 70 V40 M160.5 70 V36 M174 70 V40" stroke="'+INK+'" stroke-width="11" stroke-linecap="round"/>'+
  '<path d="M147 70 V42 M160.5 70 V38 M174 70 V42" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round"/>'+
  '<path d="M144 70 H177 V80 H144 Z" fill="#e6e6e6" stroke="'+INK+'" stroke-width="4"/>'+
  /* 体 */
  '<path d="M70 150 q30 -18 60 0 l6 38 q-36 14 -72 0 Z" fill="#ff6b4a" stroke="'+INK+'" stroke-width="5"/>'+
  /* 顔 */
  '<circle cx="100" cy="105" r="46" fill="#ffe1c4" stroke="'+INK+'" stroke-width="5"/>'+
  /* かみの毛+バンダナ */
  '<path d="M57 96 a45 45 0 0 1 86 -2 q-12 -14 -28 -12 q-4 -10 -16 -11 q-12 1 -16 11 q-16 -2 -26 14 Z" fill="#7a5236" stroke="'+INK+'" stroke-width="5"/>'+
  '<path d="M55 92 q45 -20 90 0 l-3 12 q-42 -16 -84 0 Z" fill="#ffd34d" stroke="'+INK+'" stroke-width="4.5"/>'+
  eyes(84,116,112,6.5)+
  cheeks(74,126,124)+
  '<path d="M93 126 q7 6 14 0" stroke="'+INK+'" stroke-width="4" fill="none" stroke-linecap="round"/>'+
  /* うで */
  '<path d="M72 152 q-18 0 -26 -8" stroke="'+INK+'" stroke-width="5" fill="none" stroke-linecap="round"/>'+
  '<path d="M128 152 q20 -2 30 -16" stroke="'+INK+'" stroke-width="5" fill="none" stroke-linecap="round"/>'+
  '<circle cx="160" cy="134" r="9" fill="#ffe1c4" stroke="'+INK+'" stroke-width="4.5"/>'+
  /* 足 */
  '<path d="M84 190 v14 M116 190 v14" stroke="'+INK+'" stroke-width="6" stroke-linecap="round"/>'+
  '<ellipse cx="82" cy="208" rx="13" ry="7" fill="#4a93d9" stroke="'+INK+'" stroke-width="4"/>'+
  '<ellipse cx="118" cy="208" rx="13" ry="7" fill="#4a93d9" stroke="'+INK+'" stroke-width="4"/>'
);

/* ---- 主人公(勝利ポーズ・タイトル/クリア用) ---- */
const ART_HERO_WIN = svgWrap("0 0 200 220",
  '<rect x="153" y="14" width="9" height="80" rx="4" transform="rotate(18 158 50)" fill="#f3c14b" stroke="'+INK+'" stroke-width="4"/>'+
  '<g transform="rotate(18 160 30)">'+
  '<path d="M147 36 V10 M160.5 36 V6 M174 36 V10" stroke="'+INK+'" stroke-width="11" stroke-linecap="round"/>'+
  '<path d="M147 36 V12 M160.5 36 V8 M174 36 V12" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round"/>'+
  '<path d="M144 36 H177 V46 H144 Z" fill="#e6e6e6" stroke="'+INK+'" stroke-width="4"/></g>'+
  '<path d="M70 150 q30 -18 60 0 l6 38 q-36 14 -72 0 Z" fill="#ff6b4a" stroke="'+INK+'" stroke-width="5"/>'+
  '<circle cx="100" cy="105" r="46" fill="#ffe1c4" stroke="'+INK+'" stroke-width="5"/>'+
  '<path d="M57 96 a45 45 0 0 1 86 -2 q-12 -14 -28 -12 q-4 -10 -16 -11 q-12 1 -16 11 q-16 -2 -26 14 Z" fill="#7a5236" stroke="'+INK+'" stroke-width="5"/>'+
  '<path d="M55 92 q45 -20 90 0 l-3 12 q-42 -16 -84 0 Z" fill="#ffd34d" stroke="'+INK+'" stroke-width="4.5"/>'+
  '<path d="M76 108 q8 -8 16 0 M108 108 q8 -8 16 0" stroke="'+INK+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'+
  cheeks(74,126,120)+
  '<path d="M88 122 q12 12 24 0" stroke="'+INK+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>'+
  '<path d="M72 152 q-22 -10 -26 -30" stroke="'+INK+'" stroke-width="5" fill="none" stroke-linecap="round"/>'+
  '<circle cx="44" cy="118" r="9" fill="#ffe1c4" stroke="'+INK+'" stroke-width="4.5"/>'+
  '<path d="M128 152 q22 -16 28 -44" stroke="'+INK+'" stroke-width="5" fill="none" stroke-linecap="round"/>'+
  '<circle cx="158" cy="104" r="9" fill="#ffe1c4" stroke="'+INK+'" stroke-width="4.5"/>'+
  '<path d="M84 190 v14 M116 190 v14" stroke="'+INK+'" stroke-width="6" stroke-linecap="round"/>'+
  '<ellipse cx="82" cy="208" rx="13" ry="7" fill="#4a93d9" stroke="'+INK+'" stroke-width="4"/>'+
  '<ellipse cx="118" cy="208" rx="13" ry="7" fill="#4a93d9" stroke="'+INK+'" stroke-width="4"/>'+
  '<path d="M30 40 l6 12 M170 60 l-2 -14 M50 24 l10 6" stroke="#ff9f3c" stroke-width="5" stroke-linecap="round"/>'
);

/* ---- 主人公(やられポーズ) ---- */
const ART_HERO_KO = svgWrap("0 0 200 220",
  '<ellipse cx="100" cy="196" rx="74" ry="16" fill="#d9cdb8"/>'+
  '<path d="M64 178 q36 -16 72 0 l-4 16 q-32 10 -64 0 Z" fill="#ff6b4a" stroke="'+INK+'" stroke-width="5"/>'+
  '<circle cx="100" cy="140" r="44" fill="#ffe1c4" stroke="'+INK+'" stroke-width="5"/>'+
  '<path d="M59 132 a44 44 0 0 1 84 -2 q-12 -14 -28 -12 q-4 -10 -16 -11 q-12 1 -16 11 q-16 -2 -24 14 Z" fill="#7a5236" stroke="'+INK+'" stroke-width="5"/>'+
  '<path d="M76 142 l12 12 M88 142 l-12 12 M112 142 l12 12 M124 142 l-12 12" stroke="'+INK+'" stroke-width="4.5" stroke-linecap="round"/>'+
  '<ellipse cx="100" cy="166" rx="7" ry="9" fill="'+INK+'"/>'+
  '<path d="M40 70 q10 -16 24 -6 q2 -18 18 -16" stroke="#8e6bc8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>'+
  '<circle cx="150" cy="60" r="7" fill="none" stroke="#8e6bc8" stroke-width="4" opacity=".7"/>'+
  '<circle cx="166" cy="40" r="5" fill="none" stroke="#8e6bc8" stroke-width="4" opacity=".6"/>'
);

/* ---- 第1章ボスたち ---- */
/* メジャガー(芽の出たジャガイモ) */
const ART_POTATO = svgWrap("0 0 220 200",
  '<ellipse cx="110" cy="110" rx="84" ry="66" fill="#d9a05b" stroke="'+INK+'" stroke-width="5"/>'+
  '<ellipse cx="110" cy="118" rx="84" ry="58" fill="#cf9650" opacity=".5"/>'+
  /* 緑がかった部分 */
  '<path d="M40 86 q30 -34 70 -28 q-40 4 -56 34 Z" fill="#9fbf6a" opacity=".8"/>'+
  /* 芽 */
  '<path d="M70 52 q-4 -22 12 -30" stroke="#7da94f" stroke-width="9" fill="none" stroke-linecap="round"/>'+
  '<path d="M70 52 q-4 -22 12 -30" stroke="'+INK+'" stroke-width="3" fill="none" stroke-linecap="round" opacity=".4"/>'+
  '<circle cx="84" cy="20" r="10" fill="#a8cc6e" stroke="'+INK+'" stroke-width="4"/>'+
  '<path d="M148 50 q10 -18 -2 -28" stroke="#7da94f" stroke-width="9" fill="none" stroke-linecap="round"/>'+
  '<circle cx="144" cy="18" r="9" fill="#a8cc6e" stroke="'+INK+'" stroke-width="4"/>'+
  '<path d="M186 96 q20 -6 24 -22" stroke="#7da94f" stroke-width="8" fill="none" stroke-linecap="round"/>'+

  { ch:1, enemy:'カビーノ', kind:'カビパン', art:()=>ART_KABI,

    ans:1,

  { ch:1, enemy:'クサルン', kind:'いたんだおにぎり', art:()=>ART_KUSARU,
    q:'れいぞうこに入れておいた食べものは、どうなる?',
    choices:[

    choices:[

  /* ---- 第3章 ---- */
  { ch:2, enemy:'ホネゴン', kind:'魚のほね', art:()=>ART_HONE,
    q:'やき魚を食べていたら、小さなほねがのどにささっちゃった! どうする?',
    choices:[
      'ごはんをかまずに丸のみして、おしこむ',
      'そのままほうっておけば、しぜんにとける',
      'すぐに大人につたえる。ごはんの丸のみはしない'],
    ans:2,
    exp:'「ごはんを丸のみ」は、ほねが<b>もっとふかくささる</b>ことがあるきけんなほうほう。まずは<b>大人につたえて</b>、とれないときはお医者さんへ。そうならないように、魚は<b>ほねに気をつけて、よくかんで</b>食べよう。ほねのとりかたが上手になると、魚はもっとおいしいよ!' },

  { ch:2, enemy:'タネビー', kind:'青いウメの実', art:()=>ART_UME,
    q:'木になっている青いウメの実。もいで、そのままかじってもいい?',
    choices:[
      'くだものだから、そのまま食べてよい',
      '青い実やたねには'+DOKU+'のもとがあるので、そのまま食べない',
      'たねの中身は、おやつになる'],
    ans:1,
    exp:'青いウメの実やたねには「<b>アミグダリン</b>」という、おなかの中で'+DOKU+'にかわるせいぶんがあるよ。でも、<b>うめぼしやウメシロップ</b>にかこうすると、おいしく食べられるようになるんだ。'+DOKU+'のあるものを、ちえとくふうで食べものにかえる——これも先人がのこしてくれた<b>食文化</b>だね。' },

  { ch:2, enemy:'フショクブキング', kind:'食べられないところの王', art:()=>ART_KING, boss:true,
    q:'【さいごの問題】「食べられない」と思われがちだけど、じつは おいしく食べられるのはどれ?',
    choices:[
      'だいこんの葉っぱ',
      'ジャガイモのめ',
      'フグのきも(かんぞう)'],
    ans:0,
    exp:'<b>だいこんの葉</b>は、えいようたっぷりで、いためものやふりかけにするとおいしい! いっぽう、ジャガイモのめとフグのきもは'+DOKU+'があるから×。「<b>食べられないもの</b>」と「<b>食べられるのに すてているもの</b>」を見分けられると、'+DOKU+'からも身をまもれて、「もったいない」もへらせる。きみはもう、りっぱな<b>食と'+DOKU+'はかせ</b>だ!' },
];

/* ---------- 効果音(WebAudio) ---------- */
let soundOn = true, actx = null;
function beep(freq, dur, type, vol, when){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||.08, actx.currentTime+(when||0));
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+(when||0)+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime+(when||0)); o.stop(actx.currentTime+(when||0)+dur+.05);
  }catch(e){}
}
const SFX = {
  start(){ beep(523,.12); beep(659,.12,'square',.08,.12); beep(784,.2,'square',.08,.24); },
  ok(){ beep(660,.1,'triangle',.12); beep(880,.18,'triangle',.12,.1); },
  ng(){ beep(220,.18,'sawtooth',.09); beep(165,.3,'sawtooth',.09,.15); },
  hit(){ beep(440,.06,'square',.1); beep(330,.08,'square',.08,.05); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>beep(f,.16,'triangle',.11,i*.13)); beep(1047,.5,'triangle',.1,.6); },
  gameover(){ [392,330,262,196].forEach((f,i)=>beep(f,.22,'triangle',.1,i*.2)); },
};

/* ---------- ゲームの状態 ---------- */
const MAX_HP = 100, DMG = 25;
let state = {};
function resetGame(){ state = { hp:MAX_HP, qIndex:0, correct:0, checkpointQ:0, checkpointHP:MAX_HP }; }
const app = document.getElementById('app');

function hpClass(hp){ return hp<=25 ? 'danger' : (hp<=50 ? 'low' : ''); }

/* ---------- 画面: タイトル ---------- */
function showTitle(){
  resetGame();
  app.innerHTML =
  '<div class="title-screen">'+
    '<div class="title-ribbon">「食と'+DOKU+'」けんきゅうクイズRPG</div>'+
    '<h1 class="game-title">食どくクエスト</h1>'+
    '<div class="game-sub">〜食と'+DOKU+'のだいぼうけん〜</div>'+
    '<div class="title-art">'+ART_TITLE+'</div>'+
    '<p class="title-msg">'+DOKU+'のある生きものや、いたんだ食べもの…。<br>'+
    'わたしたちの「食」には、きけんが ひそんでいる!<br>'+
    'クイズにこたえてモンスターをたおそう。<br>'+
    '<b>まちがえると、ゆうしゃがダメージを うけるぞ!</b></p>'+
    '<button class="btn" id="startBtn">ぼうけんに出発!</button>'+
  '</div>';
  document.getElementById('startBtn').onclick = ()=>{ SFX.start(); showChapter(0); };
}

/* ---------- 画面: 章とびら ---------- */
function showChapter(chIdx){
  const ch = CHAPTERS[chIdx];
  /* チェックポイント保存 */
  state.checkpointQ = state.qIndex; state.checkpointHP = state.hp;
  app.innerHTML =
  '<div class="chapter-screen">'+
    '<div class="chapter-num">'+ch.num+'</div>'+
    '<h2 class="chapter-title">'+ch.title+'</h2>'+
    '<div class="chapter-art">'+ch.art()+'</div>'+
    '<p class="chapter-desc">'+ch.desc+'</p>'+
    '<button class="btn blue" id="goBtn">すすむ</button>'+
  '</div>';
  document.getElementById('goBtn').onclick = ()=>{ SFX.start(); showBattle(); };
}

/* ---------- 画面: バトル ---------- */
function showBattle(){
  const q = QUESTIONS[state.qIndex];
  const ch = CHAPTERS[q.ch];
  app.innerHTML =
  '<div class="hud">'+
    '<span class="chapter-tag">'+ch.num+' '+ch.title+'</span>'+
    '<span class="q-count">もんだい '+(state.qIndex+1)+' / '+QUESTIONS.length+'</span>'+
  '</div>'+
  '<div class="stage" id="stage">'+
    cloud(8,8,1)+cloud(58,4,1.2)+cloud(80,20,.8)+
    '<div class="hp-box"><div class="hp-label"><span>ゆうしゃのHP</span><span id="hpNum">'+state.hp+'/'+MAX_HP+'</span></div>'+
    '<div class="hp-bar"><div class="hp-fill '+hpClass(state.hp)+'" id="hpFill" style="width:'+(state.hp/MAX_HP*100)+'%"></div></div></div>'+
    '<div class="enemy-name">'+(q.boss?'<small>★ボスとうじょう★</small>':'<small>'+q.kind+'</small>')+q.enemy+(q.boss?'<small>'+q.kind+'</small>':'')+'</div>'+
    '<div class="hero-zone hero-bounce" id="heroZone">'+ART_HERO+'</div>'+
    '<div class="enemy-zone enemy-in" id="enemyZone">'+q.art()+'</div>'+
  '</div>'+
  '<div class="speech">'+
    '<span class="q-badge">'+q.enemy+'からの ちょうせんじょう!</span>'+
    '<p class="q-text">'+q.q+'</p>'+
    '<div class="choices" id="choices">'+
      q.choices.map((c,i)=>'<button class="choice" data-i="'+i+'"><span class="mark">'+'ABC'[i]+'</span><span>'+c+'</span></button>').join('')+
    '</div>'+
  '</div>';
  /* 登場後にふわふわアニメへ */
  const ez = document.getElementById('enemyZone');
  setTimeout(()=>{ ez.classList.remove('enemy-in'); ez.classList.add('enemy-float'); }, 550);

  document.querySelectorAll('.choice').forEach(btn=>{
    btn.onclick = ()=> answer(parseInt(btn.dataset.i,10), btn);
  });
}

function answer(i, btn){
  const q = QUESTIONS[state.qIndex];
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  const correct = (i === q.ans);
  const stage = document.getElementById('stage');
  const ez = document.getElementById('enemyZone');
  const hz = document.getElementById('heroZone');

  if(correct){
    state.correct++;
    btn.classList.add('picked-correct');
    SFX.hit();
    ez.classList.remove('enemy-float'); ez.classList.add('enemy-hit');
    setTimeout(()=>{ SFX.ok(); showResult(true, q); }, 750);
  }else{
    btn.classList.add('picked-wrong');
    state.hp = Math.max(0, state.hp - DMG);
    SFX.ng();
    stage.classList.add('flash-red');
    hz.classList.remove('hero-bounce'); hz.classList.add('shake');
    const fill = document.getElementById('hpFill');
    fill.style.width = (state.hp/MAX_HP*100)+'%';
    fill.className = 'hp-fill '+hpClass(state.hp);
    document.getElementById('hpNum').textContent = state.hp+'/'+MAX_HP;
    setTimeout(()=>{ showResult(false, q); }, 800);
  }
}

/* ---------- 画面: 解説 ---------- */
function showResult(correct, q){
  const dead = (state.hp <= 0);
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML =
  '<div class="result-card">'+
    (correct
      ? '<div class="result-stamp ok">せいかい!</div><div style="font-size:14px">'+q.enemy+'を たおした!</div>'
      : '<div class="result-stamp ng">ざんねん…</div><div class="result-dmg">ゆうしゃは '+DMG+' のダメージをうけた!</div>')+
    '<div class="kaisetsu"><span class="k-title">かいせつ</span><br>'+q.exp+'</div>'+
    '<button class="btn '+(correct?'green':'blue')+'" id="nextBtn">'+
      (dead ? 'けっか を見る' : (state.qIndex===QUESTIONS.length-1 ? 'けっか を見る' : 'つぎへすすむ'))+
    '</button>'+
  '</div>';
  document.body.appendChild(ov);
  document.getElementById('nextBtn').onclick = ()=>{
    ov.remove();
    if(dead){ showGameOver(); return; }
    state.qIndex++;
    if(state.qIndex >= QUESTIONS.length){ showEnding(); return; }
    const prevCh = QUESTIONS[state.qIndex-1].ch, nowCh = QUESTIONS[state.qIndex].ch;
    if(nowCh !== prevCh){ showChapter(nowCh); } else { showBattle(); }
  };
}

/* ---------- 画面: ゲームオーバー ---------- */
function showGameOver(){
  SFX.gameover();
  app.innerHTML =
  '<div class="end-screen">'+
    '<h2 class="chapter-title" style="color:var(--purple)">ゲームオーバー…</h2>'+
    '<div class="chapter-art" style="max-width:230px">'+ART_HERO_KO+'</div>'+
    '<p class="chapter-desc">ゆうしゃは'+DOKU+'にやられてしまった…。<br>でもだいじょうぶ。<b>まちがえたぶんだけ、くわしくなれる!</b><br>この章のさいしょから、もういちど ちょうせんしよう。</p>'+
    '<button class="btn" id="retryBtn">この章から もういちど</button><br><br>'+
    '<button class="btn blue" id="titleBtn" style="font-size:15px;padding:9px 22px">タイトルにもどる</button>'+
  '</div>';
  document.getElementById('retryBtn').onclick = ()=>{
    state.qIndex = state.checkpointQ; state.hp = MAX_HP;
    state.checkpointHP = MAX_HP;
    SFX.start(); showBattle();
  };
  document.getElementById('titleBtn').onclick = showTitle;
}

/* ---------- 画面: クリア ---------- */
function showEnding(){
  SFX.fanfare();
  const c = state.correct, total = QUESTIONS.length;
  let rank, msg;
  if(c === total){ rank = 'でんせつの食どくマスター'; msg = 'ぜんもんせいかい! きみの知しきは、もうはかせレベルだ!'; }
  else if(c >= 8){ rank = '食と'+DOKU+'はかせ'; msg = 'すばらしい! あぶない食べものを しっかり見ぬけたね!'; }
  else if(c >= 5){ rank = '見ならい けんきゅういん'; msg = 'よくがんばった! まちがえた問題こそ、たからものだよ。'; }
  else { rank = 'かけだし ぼうけんしゃ'; msg = 'ゴールできたのがすごい! かいせつをもういちど読んでみよう。'; }
  app.innerHTML =
  '<div class="end-screen">'+
    '<h2 class="chapter-title" style="color:var(--green-deep)">クエスト クリア!</h2>'+
    '<div class="chapter-art" style="max-width:240px">'+ART_HERO_WIN+'</div>'+
    '<div class="rank-card">きみのしょうごう<br><span class="rank-name">'+rank+'</span>'+
    '<div class="stat-row">せいかい '+c+' / '+total+' もん ・ のこりHP '+state.hp+'</div></div>'+
    '<p class="chapter-desc">'+msg+'<br><br>'+
    DOKU+'のことを知ると、ふだんの「食」が ちがって見えてくる。<br>'+
    'あぶないものを ちえとくふうで おいしくかえてきた——<br>それが、わたしたちの<b>「食文化」</b>なんだ。</p>'+
    '<button class="btn" id="againBtn">もういちど あそぶ</button>'+
  '</div>';
  document.getElementById('againBtn').onclick = ()=>{ SFX.start(); showTitle(); };
}

/* ---------- 音ボタン ---------- */
document.getElementById('soundBtn').onclick = function(){
  soundOn = !soundOn;
  this.innerHTML = '音<br>'+(soundOn?'ON':'OFF');
  if(soundOn) SFX.ok();
};

showTitle();

</script>
